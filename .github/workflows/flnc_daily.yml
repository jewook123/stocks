name: FLNC 주식 분석 → Telegram

on:
  schedule:
    # 매일 오전 9시 KST (UTC 00:00)
    - cron: "0 0 * * 1-5"
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: FLNC 분석 실행 및 Telegram 전송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python flnc_analysis.py --telegram

      - name: 분석 리포트 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flnc-report-${{ github.run_id }}
          path: flnc_report_*.json
          retention-days: 30
